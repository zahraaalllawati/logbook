<style>
:root {
  --teal: #0F5E63; --teal-2: #23767B; --teal-3: #2B7F84; --mint: #DCEFEC; --page: #F1F6F5; --card: #FFFFFF;
  --ink: #1C2B2C; --soft: #55696B; --dark: #314749; --line: #C6D8D5; --dash: #B6CBC8; --rule: #E4EEEC;
  --track: #D3E6E3; --tint: #F6FAF9; --amber: #E8A33D; --amber-ink: #8A5A00; --amber-bg: #FDF0D9;
  --cream: #FFF4DC; --head-soft: #D2ECEA; --ok-ink: #0B4F53; --back-bg: #FBE7EA; --back-ink: #9B1C31;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 17px/1.35 "Barlow Semi Condensed", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
body:before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--teal); z-index: 100; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--teal); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 560px; margin: 0 auto; }

/* ---------- signing in ---------- */
.gate { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: calc(28px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom)); }
.gate-in { flex: 1; width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.gate-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.gate-logo svg { width: 84px; height: 84px; }
.gate h1 { font-size: 38px; line-height: 1.05; font-weight: 700; color: var(--teal); }
.lead { font-size: 19px; line-height: 1.3; color: var(--soft); max-width: 300px; }
.gate-form { display: flex; flex-direction: column; gap: 14px; }
.gate-title { font-size: 30px; line-height: 1.1; font-weight: 700; color: var(--teal); }
.gate-text { font-size: 18px; line-height: 1.4; }
.gate-foot { text-align: center; font-size: 14px; color: var(--soft); margin-top: 24px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.label, .field label { font-size: 18px; font-weight: 700; }
.label small { font-weight: 500; color: var(--soft); font-size: 16px; }
.input { width: 100%; height: 54px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-size: 19px; }
.input:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(15, 94, 99, .18); }
.code-input { font-size: 30px; font-weight: 600; letter-spacing: .32em; text-align: center; padding-left: calc(16px + .32em); }
textarea.input { height: auto; min-height: 86px; padding: 12px 16px; resize: vertical; line-height: 1.35; font-size: 18px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 18px; border: 0; border-radius: 14px; background: var(--teal); color: #fff; font-size: 20px; font-weight: 600; line-height: 1.15; text-align: center; text-decoration: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn-line { background: #fff; color: var(--teal); box-shadow: inset 0 0 0 1.5px var(--teal); }
.btn-small { width: auto; min-height: 44px; padding: 0 16px; font-size: 17px; border-radius: 12px; }
.btn-danger { background: #fff; color: var(--back-ink); box-shadow: inset 0 0 0 1.5px var(--back-ink); }
.link-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--teal); font-size: 17px; font-weight: 600; text-decoration: none; }
.link-btn[disabled] { color: var(--soft); cursor: default; }
.link-btn svg { width: 20px; height: 20px; }
.note { font-size: 15px; line-height: 1.35; color: var(--soft); }
.center { text-align: center; }
.err { padding: 10px 14px; border-radius: 12px; background: var(--back-bg); color: var(--back-ink); font-size: 16px; line-height: 1.35; }
.calm { padding: 10px 14px; border-radius: 12px; background: var(--amber-bg); color: #5C3D00; font-size: 16px; line-height: 1.35; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.calm button { border: 0; background: var(--ink); color: #fff; border-radius: 9px; min-height: 36px; padding: 0 12px; font-weight: 600; }

/* ---------- progress ---------- */
.hero { background: var(--teal); padding: calc(14px + env(safe-area-inset-top)) 22px 64px; color: var(--cream); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: var(--cream); min-width: 0; }
.brand svg { width: 32px; height: 32px; flex: none; }
.brand small { font-size: 17px; font-weight: 500; color: var(--head-soft); }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: var(--teal-3); color: var(--cream); font-size: 17px; font-weight: 700; }
.hero h1 { margin-top: 16px; font-size: 30px; line-height: 1.08; font-weight: 700; color: var(--cream); overflow-wrap: anywhere; }
.hero-sub { margin-top: 4px; font-size: 17px; color: var(--head-soft); }
.summary { position: relative; margin: -44px 16px 0; background: #fff; border-radius: 20px; box-shadow: 0 6px 18px rgba(15, 94, 99, .10); padding: 18px 20px; display: flex; align-items: center; gap: 18px; }
.ring { width: 96px; height: 96px; flex: none; }
.sum { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sum-main { font-size: 23px; line-height: 1.15; font-weight: 700; }
.sum-wait { display: flex; align-items: center; gap: 8px; font-size: 17px; line-height: 1.25; }
.dot { width: 10px; height: 10px; border-radius: 5px; background: var(--amber); flex: none; }
.sum-day { font-size: 16px; color: var(--soft); }
.sec { padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; padding: 0 4px; }
.sec h2 { font-size: 19px; font-weight: 700; }
.legend { display: flex; gap: 10px; font-size: 13px; color: var(--soft); }
.legend span { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: block; }
.card { background: #fff; border-radius: 18px; }
.procs { padding: 4px 18px; }
.proc { padding: 13px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--rule); }
.proc:last-child { border-bottom: 0; }
.proc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.proc-name { font-size: 19px; font-weight: 600; }
.proc-num { font-size: 20px; font-weight: 700; color: var(--teal); white-space: nowrap; }
.chip-done { display: inline-block; margin-left: 8px; padding: 1px 9px 2px; border-radius: 9px; background: var(--mint); color: var(--ok-ink); font-size: 14px; font-weight: 600; vertical-align: 2px; }
.segs { display: flex; gap: 5px; }
.segs i { flex: 1; height: 10px; border-radius: 5px; background: var(--track); display: block; }
.segs i.d { background: var(--teal); }
.segs i.w { background: var(--amber); }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; display: block; }
.proc-notes { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.proc-note { font-size: 15px; color: var(--soft); }
.proc-note.w { color: var(--amber-ink); }
.proc-note.b { color: var(--back-ink); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.opt b { font-size: 17px; font-weight: 600; }
.opt span { font-size: 15px; color: var(--soft); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 26px 16px calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, rgba(241, 246, 245, 0), var(--page) 24px); }
.dock-in { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dock-btns { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; }
.dock-btns .btn { font-size: 18px; padding: 8px 10px; }
.tabs a { display: flex; align-items: center; justify-content: center; min-height: 46px; font-size: 17px; font-weight: 600; color: var(--dark); text-decoration: none; border-bottom: 3px solid transparent; }
.tabs a[aria-current="page"] { color: var(--teal); border-bottom-color: var(--teal); }
.dock-room { height: 170px; }
.link-sm { font-size: 15px; font-weight: 600; color: var(--teal); text-decoration: none; min-height: 32px; display: inline-flex; align-items: center; }
.rows { padding: 2px 18px; }
.rrow { display: flex; flex-direction: column; gap: 7px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; color: inherit; text-decoration: none; }
.rrow:last-child { border-bottom: 0; }
.rrow .proc-name { font-size: 18px; }
.trow { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; color: inherit; }
.trow:last-child { border-bottom: 0; }
.trow-l { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.trow-l b { font-size: 17px; font-weight: 600; line-height: 1.25; }
.trow-l span { font-size: 15px; color: var(--soft); }
.trow-more { display: flex; align-items: center; min-height: 48px; font-size: 16px; font-weight: 600; color: var(--teal); text-decoration: none; }
.empty-row { padding: 14px 0; font-size: 16px; color: var(--soft); }
.track { padding: 0 16px; }
.track-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 64px; padding: 12px 0; border: 0; background: none; text-align: left; color: inherit; }
.track-head h2 { font-size: 20px; font-weight: 700; color: var(--teal); }
.track-head small { display: block; font-size: 15px; color: var(--soft); margin-top: 1px; }
.track-head .chev { flex: none; width: 22px; height: 22px; color: var(--soft); transition: transform .2s; }
.track-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.mods { border-top: 1px solid var(--rule); padding-bottom: 6px; }
.mod { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--rule); }
.mod:last-child { border-bottom: 0; }
.tick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; border: 0; background: none; text-align: left; font-size: 17px; line-height: 1.25; color: inherit; }
.tick .box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: #fff; }
.tick .box svg { width: 18px; height: 18px; }
.tick[aria-pressed="true"] .box { background: var(--teal); border-color: var(--teal); }
.open { flex: none; min-height: 44px; display: flex; align-items: center; padding: 0 2px 0 8px; font-size: 15px; font-weight: 600; color: var(--teal); text-decoration: none; }

/* ---------- log a procedure ---------- */
.page { padding: calc(10px + env(safe-area-inset-top)) 20px 28px; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page h1 { font-size: 32px; line-height: 1.05; font-weight: 700; color: var(--teal); }
.page-sub { font-size: 16px; color: var(--soft); }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 10px; font-size: 18px; font-weight: 700; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.chip { min-height: 50px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-size: 17px; font-weight: 600; line-height: 1.15; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip.is-opt { border-style: dashed; border-color: var(--dash); background: var(--tint); }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); border-style: solid; color: var(--cream); }
.sub-label { margin: 14px 0 10px; font-size: 15px; font-weight: 600; color: var(--soft); }
.hint { margin-top: 8px; font-size: 15px; line-height: 1.35; color: var(--soft); }
.hint b { color: var(--ink); font-weight: 600; }
.date-box { position: relative; }
.date-face { height: 52px; padding: 0 12px 0 16px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-size: 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.date-box input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
.date-box:focus-within .date-face { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15, 94, 99, .18); }
.pill { padding: 2px 10px; border-radius: 10px; background: var(--mint); font-size: 14px; font-weight: 600; color: var(--teal); white-space: nowrap; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: var(--mint); }
.seg button { min-height: 46px; border: 0; border-radius: 11px; background: transparent; font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--dark); padding: 4px 8px; }
.seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 3px rgba(15, 94, 99, .18); font-weight: 700; color: var(--teal); }
.cos { padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 16px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cos-l { font-size: 15px; color: var(--soft); }
.cos-n { font-size: 24px; line-height: 1.15; font-weight: 700; color: var(--teal); }
.cos-n.none { font-size: 19px; color: var(--ink); }
.cos-w { font-size: 15px; line-height: 1.3; color: var(--soft); }
.cos-btn { flex: none; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 17px; font-weight: 600; color: var(--teal); }
.form-end { position: sticky; bottom: 0; z-index: 5; margin: 0 -20px -28px; padding: 18px 20px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(to bottom, rgba(241, 246, 245, 0), var(--page) 18px); }
.kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kind { min-height: 84px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 16px; background: #fff; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 8px; text-align: left; font-size: 18px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.kind svg { width: 28px; height: 28px; color: var(--teal); }
.kind[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--cream); }
.kind[aria-pressed="true"] svg { color: var(--cream); }
.rowpick { width: 100%; min-height: 66px; padding: 10px 12px 10px 16px; border: 1.5px solid var(--line); border-radius: 16px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--ink); }
.rowpick.set { border-color: var(--teal); }
.rowpick svg { width: 22px; height: 22px; flex: none; color: var(--soft); }
.rp-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rp-l b { font-size: 19px; font-weight: 700; line-height: 1.2; color: var(--teal); overflow-wrap: anywhere; }
.rp-l b.none { color: var(--ink); font-weight: 600; }
.rp-l small { font-size: 15px; color: var(--soft); }
.rp-l .rp-track { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.rp-act { flex: none; min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: var(--teal); }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.names .chip { padding: 6px 10px; }
.add-note { font-size: 17px; }
.tp-wrap { display: flex; flex-direction: column; gap: 12px; }
.tp-list { display: flex; flex-direction: column; gap: 8px; }
.tp { width: 100%; min-height: 54px; padding: 8px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; display: flex; flex-direction: column; justify-content: center; gap: 1px; text-align: left; color: var(--ink); }
.tp b { font-size: 18px; font-weight: 600; line-height: 1.2; }
.tp small { font-size: 14px; color: var(--soft); }
.tp[aria-pressed="true"] { border-color: var(--teal); background: var(--mint); }
.tp-track { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
.tp-track svg { width: 20px; height: 20px; flex: none; color: var(--soft); }
.tp-l { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tp-other { border-style: dashed; border-color: var(--dash); background: var(--tint); }
.tp-other b { color: var(--teal); }
.tp-h { margin: 2px 2px 0; font-size: 20px; font-weight: 700; color: var(--ink); }
.tp-back { margin-bottom: -4px; }
.tp-own { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--page); }

/* ---------- my log ---------- */
.mylog { padding: calc(20px + env(safe-area-inset-top)) 16px 0; display: flex; flex-direction: column; gap: 8px; }
.mylog .page-head { padding: 0 4px; }
.mylog h1 { font-size: 32px; line-height: 1.05; font-weight: 700; color: var(--teal); }
.banner { margin: 6px 0 2px; padding: 12px 14px; border-radius: 16px; background: var(--mint); display: flex; align-items: center; gap: 12px; }
.banner svg { width: 30px; height: 30px; flex: none; }
.banner b { display: block; font-size: 18px; line-height: 1.2; color: var(--ok-ink); }
.banner span { display: block; font-size: 15px; }
.day-h { margin: 8px 4px 0; font-size: 16px; font-weight: 700; color: var(--soft); }
.item { width: 100%; border: 0; border-radius: 14px; background: #fff; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.item-l { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.item-name { font-size: 18px; font-weight: 600; line-height: 1.2; }
.item-sub { font-size: 15px; color: var(--soft); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(28, 43, 44, .45); display: flex; align-items: flex-end; justify-content: center; }

.x { width: 44px; height: 44px; flex: none; margin: -8px -10px 0 0; border: 0; border-radius: 22px; background: none; color: var(--soft); display: flex; align-items: center; justify-content: center; }
.x svg { width: 22px; height: 22px; }

.tbody { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }

.t th { padding: 8px 12px; border-bottom: 1px solid var(--rule); font-size: 14px; font-weight: 600; color: var(--soft); text-align: left; white-space: nowrap; }
.t td { padding: 10px 12px; border-bottom: 1px solid var(--rule); font-size: 16px; white-space: nowrap; }

.t .zero { color: var(--soft); }
.t .met { display: inline-block; padding: 1px 10px 2px; border-radius: 10px; background: var(--mint); color: var(--ok-ink); font-weight: 600; }
.t .w { color: var(--amber-ink); font-weight: 600; }
.t .tot { font-weight: 700; }
.cards3 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.mini { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mini h2 { font-size: 19px; font-weight: 700; }

@media (min-width: 760px) {
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cards3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

}
@media (max-width: 359px) {
  .chips, .opts { grid-template-columns: minmax(0, 1fr); }
  .summary { gap: 12px; padding: 16px; }
  .ring { width: 80px; height: 80px; }
  .hero h1 { font-size: 27px; }
}
.practice { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px; background: var(--amber-bg); color: #5C3D00; font-size: 15px; line-height: 1.3; box-shadow: 0 1px 0 rgba(0,0,0,.06); }

<script>
(function () {

  // ---------------------------------------------------------- where it runs, and what it keeps on the phone

  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

    step: 'email', skew: 0, busy: false, error: '', flash: null, form: null, offline: false,
    sentAt: 0, lastFetch: 0, fetching: false, sheet: null, seen: '',
    tracker: null, tBlock: 0, tBusy: false, tError: '', tNote: ''
  };
  if (S.data && (!S.data.me || !S.data.procedures)) S.data = null;
  if (S.data && !S.data.reading) { S.data.reading = []; S.data.ticks = []; S.data.teaching = []; S.data.teachers = []; }
  S.open = {}; S.tform = null; S.readErr = '';
  if (S.data && S.data.cfg) mergeCfg(S.data.cfg);

  // ---------------------------------------------------------- talking to the script

  function call(op, extra) {
    var body = { op: op, token: S.token };
    if (extra) for (var k in extra) body[k] = extra[k];
    return new Promise(function (resolve) {
      var done = function (text) {
        var r = null;
        try { r = typeof text === 'string' ? JSON.parse(text) : text; } catch (e) { r = null; }
        resolve(r && typeof r === 'object' ? r : { ok: false, error: 'network', message: NET });
      };

      x.ontimeout = lost;
      x.send(JSON.stringify(body));
    });
  }

  // An answer that carries the person's logbook: keep it, and on the phone too.
  function took(r) {
    if (r.serverNow) S.skew = r.serverNow - Date.now();
    if (r.cfg) mergeCfg(r.cfg);
    if (r.token) { S.token = r.token; save(KEY.token, r.token); }
    if (r.me) {
      S.data = { me: r.me, cfg: r.cfg, procedures: r.procedures || [], cosigners: r.cosigners || [], entries: r.entries || [], days: r.days || {},

    S.offline = false;
  }

  function signedOut(message) {
    S.token = ''; S.data = null; S.tracker = null; S.form = null; S.sheet = null; S.flash = null;

    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    render();
  }

  // ---------------------------------------------------------- practice: the supervisor tries the resident screens
  function practising() { return !!(S.data && S.data.me && S.data.me.practice); }
  function startPractice() {
    if (S.busy) return;
    S.busy = true; S.tNote = ''; S.tError = '';
    render();
    call('practice').then(function (r) {
      S.busy = false;
      if (r.ok && r.token) {
        save(KEY.admin, S.token);
        took(r);
        S.sheet = null; S.flash = null;
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      } else if (r.error === 'signed_out') { signedOut(r.message); return; }
      else S.tError = r.message || NET;
      render();
    });
  }
  function endPractice() {
    var t = load(KEY.admin);
    save(KEY.admin, '');
    if (!t) { signedOut(''); return; }
    S.token = t; save(KEY.token, t);
    S.data = null; save(KEY.data, '');
    S.sheet = null; S.flash = null; S.form = null; S.tform = null; S.tracker = null;
    location.hash = 'tracker';
    refresh(false);
    render();
  }
  function clearPractice() {
    if (S.busy) return;
    S.busy = true;
    call('practiceclear').then(function (r) {
      S.busy = false;
      if (r.ok) { took(r); S.flash = { title: 'Practice cleared', text: 'Everything you logged in practice is withdrawn.' }; location.hash = 'mylog'; }
      else if (r.error === 'signed_out') { signedOut(r.message); return; }
      render();
    });
  }
  function practiceBar() {
    return h('div', { class: 'practice', role: 'status' }, [
      h('span', null, [h('b', { text: 'Practice. ' }), h('span', { text: 'This is what residents see. Co-sign emails come to you; nothing counts.' })]),
      h('span', { class: 'pb' }, [
        h('button', { class: 'p-clear', type: 'button', disabled: S.busy, onclick: clearPractice }, 'Clear practice'),
        h('button', { class: 'p-back', type: 'button', onclick: endPractice }, 'Back to the tracker')
      ])
    ]);
  }

  function refresh(quiet) {
    if (!S.token || S.fetching) return;
    S.fetching = true;
    call('me').then(function (r) {
      S.fetching = false;
      if (r.ok) { took(r); render(); }
      else if (r.error === 'signed_out') signedOut(r.message);
      else { S.offline = true; if (!quiet || !S.data) render(); else render(); }
    });
  }

  // ---------------------------------------------------------- dates, in Muscat time

  var WD3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function nowM() { var d = new Date(Date.now() + S.skew + cfg.offsetMin * 60000); return { key: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
  function utc(key) { var p = String(key).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function addDays(key, n) { var d = utc(key); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function between(a, b) { return Math.round((utc(b) - utc(a)) / 864e5); }

    var s = S.data && S.data.days ? S.data.days[key] : null;

  }

  var LOGO = '<svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0F5E63"/><g fill="none" stroke-width="44"><path d="M 269.95 96.61 A 160 160 0 0 1 403.28 193.48" stroke="#E8A33D"/><path d="M 411.90 220.01 A 160 160 0 0 1 360.97 376.75" stroke="#E8A33D"/><path d="M 338.41 393.15 A 160 160 0 0 1 173.59 393.15" stroke="#E8A33D"/><path d="M 151.03 376.75 A 160 160 0 0 1 100.10 220.01" stroke="#4E8F93"/><path d="M 108.72 193.48 A 160 160 0 0 1 242.05 96.61" stroke="#4E8F93"/></g><path d="M 190 262 L 236 306 L 326 212" fill="none" stroke="#FFF4DC" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  function route() {
    if (!S.token) return S.step === 'code' ? 'code' : 'signin';

  function render() {

    if (same) window.scrollTo(0, y);
    else {
      S.seen = v;
      window.scrollTo(0, 0);
      if (v === 'tracker' && !S.tBusy && (!S.tracker || (S.tBlock && S.tracker.block && S.tracker.block.n !== S.tBlock))) loadTracker();
    }
  }

  // ---------------------------------------------------------- signing in

  function vSignin() {
    var input = h('input', { class: 'input', id: 'email', type: 'email', inputmode: 'email', autocomplete: 'email', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', placeholder: 'name@example.com', 'aria-describedby': 'email-help', value: S.email });
    var form = h('form', { class: 'gate-form', novalidate: true, onsubmit: function (ev) { ev.preventDefault(); askCode(input.value); } }, [
      h('div', { class: 'field' }, [h('label', { for: 'email', text: 'Your email' }), input]),
      S.error ? h('p', { class: 'err', role: 'alert', text: S.error }) : null,
      h('button', { class: 'btn', type: 'submit', disabled: S.busy }, S.busy ? 'Sending…' : 'Send me a sign-in code'),
      h('p', { class: 'note center', id: 'email-help', text: 'Use the email address your PICU welcome email came to.' })
    ]);
    return h('main', { class: 'gate' }, [
      h('div', { class: 'gate-in' }, [
        h('div', { class: 'gate-logo' }, [logo(), h('h1', { text: cfg.title }), h('p', { class: 'lead', text: 'Your procedures, reading and teaching in PICU and HDU.' })]),
        form
      ]),
      h('p', { class: 'gate-foot', text: cfg.unit })

  }

  function askCode(raw) {

  // ---------------------------------------------------------- log a procedure

  function newForm() {
    var me = S.data.me, now = nowM(), today = now.key, date, when;
    if (today > me.end) { date = me.end; when = workday(date) ? 'day' : 'call'; }

    return { proc: '', date: date, when: when, unit: units.indexOf(me.area) >= 0 ? me.area : units[0], ok: true, cos: '', picked: false, note: '', nonce: nonce() };
  }
  function nonce() { var s = ''; for (var i = 0; i < 4; i++) s += Math.floor((1 + Math.random()) * 0x10000).toString(16).slice(1); return s + Date.now().toString(36); }
  function procBy(name) { return S.data.procedures.filter(function (p) { return p.name === name; })[0] || null; }

      noteIn,

  }
  function hm(min) { return ('0' + Math.floor(min / 60)).slice(-2) + ':' + ('0' + (min % 60)).slice(-2); }

  function sendLog() {
    var f = S.form, p = procBy(f.proc);

              else { S.sheet.error = r.message || NET; drawSheet(); }
            });
          } }, S.busy ? 'Withdrawing…' : 'Withdraw'),
          h('button', { class: 'btn btn-line', type: 'button', onclick: function () { S.sheet.confirm = false; drawSheet(); } }, 'Keep it')
        ]));
      } else kids.push(h('button', { class: 'btn btn-danger', type: 'button', onclick: function () { S.sheet.confirm = true; drawSheet(); } }, 'Withdraw this entry'));
    } else if (st === 'back') kids.push(h('p', { class: 'note', text: 'It does not count. If it needs putting right, add it again.' }));
    if (S.sheet.error) kids.push(h('p', { class: 'err', role: 'alert', text: S.sheet.error }));
    return { title: 'Teaching', content: h('div', { style: 'display:flex;flex-direction:column;gap:12px' }, kids) };
  }

  function sheetEntry() {
    var e = S.data.entries.filter(function (x) { return x.id === S.sheet.id; })[0];
    if (!e) return null;
    var facts = [['Procedure', e.proc], ['Date', dLong(e.date) + ', ' + (e.when === 'call' ? 'on call' : 'day')], ['Unit', e.unit], ['Outcome', e.ok ? 'Successful' : 'Not successful']];
    if (e.cos) facts.push(['Co-signer', dr(e.cos)]);
    facts.push(['Status', e.st === 'logged' ? 'Logged, optional' : ST_TEXT[e.st]]);
    if (e.note) facts.push(['Note', e.note]);
    if (e.st === 'back' && e.why) facts.push(['Returned', '“' + e.why + '”']);
    var kids = [h('dl', { class: 'facts' }, facts.map(function (x) { return [h('dt', { text: x[0] }), h('dd', { text: x[1] })]; }))];
    if (e.st === 'wait' || e.st === 'logged') {
      if (S.sheet.confirm) {
        kids.push(h('p', { style: 'font-size:17px', text: 'Withdraw it? It comes out of your log' + (e.st === 'wait' ? ' and ' + dr(e.cos) + ' will not need to co-sign it.' : '.') }));
        kids.push(h('div', { class: 'row-btns' }, [
          h('button', { class: 'btn btn-danger', type: 'button', disabled: S.busy, onclick: function () { withdraw(e); } }, S.busy ? 'Withdrawing…' : 'Withdraw'),
          h('button', { class: 'btn btn-line', type: 'button', onclick: function () { S.sheet.confirm = false; drawSheet(); } }, 'Keep it')
        ]));
      } else kids.push(h('button', { class: 'btn btn-danger', type: 'button', onclick: function () { S.sheet.confirm = true; drawSheet(); } }, 'Withdraw this entry'));
    }
    if (S.sheet.error) kids.push(h('p', { class: 'err', role: 'alert', text: S.sheet.error }));
    return { title: e.proc, content: h('div', { style: 'display:flex;flex-direction:column;gap:12px' }, kids) };
  }

  function withdraw(e) {
    S.busy = true; drawSheet();
    call('withdraw', { id: e.id }).then(function (r) {
      S.busy = false;
      if (r.ok) { took(r); S.sheet = null; S.flash = { title: 'Withdrawn', text: e.proc + ', ' + dShort(e.date) + ' is out of your log.' }; render(); }
      else if (r.error === 'signed_out') signedOut(r.message);
      else { S.sheet.error = r.message || NET; drawSheet(); }
    });
  }

  // ---------------------------------------------------------- the tracker

  function loadTracker() {
    S.tBusy = true; S.tError = '';
    call('tracker', { block: S.tBlock || 0 }).then(function (r) {
      S.tBusy = false;
      if (r.ok) { S.tracker = r; if (r.serverNow) S.skew = r.serverNow - Date.now(); if (r.block) S.tBlock = r.block.n; }
      else if (r.error === 'signed_out') { signedOut(r.message); return; }
      else S.tError = r.message || NET;
      render();
    });
    render();
  }

  function vTracker() {
    var me = S.data.me, t = S.tracker;
    var sel = null;
    if (t && t.blocks && t.blocks.length) {
      sel = h('select', { id: 'block', 'aria-label': 'Block', onchange: function () { S.tBlock = Number(sel.value); S.tNote = ''; loadTracker(); } }, t.blocks.map(function (b) {
        var o = h('option', { value: String(b.n), text: 'Block ' + b.n + ' · ' + dm(b.start) + ' to ' + dm(b.end) + ' ' + b.end.slice(0, 4) });
        if (t.block && b.n === t.block.n) o.selected = true;
        return o;
      }));
    }
    var head = h('header', { class: 'thead' }, [h('div', { class: 'thead-in' }, [
      h('span', { class: 'brand' }, [logo('#23767B'), h('span', { text: cfg.title }), h('small', { text: 'Tracker' })]),
      sel ? h('label', { class: 'blocksel' }, [h('span', { text: 'Block' }), sel]) : null,
      h('button', { class: 'avatar', type: 'button', 'aria-label': 'Account: ' + dr(me.short), onclick: function () { S.sheet = { kind: 'account' }; drawSheet(); } }, initials(me.short))
    ])]);
    var body = h('main', { class: 'tbody' });
    if (!t) { body.appendChild(S.tError ? h('div', { class: 'gate-form', style: 'max-width:420px;margin:30px auto' }, [h('p', { class: 'err', role: 'alert', text: S.tError }), h('button', { class: 'btn', type: 'button', onclick: loadTracker }, 'Try again')]) : h('p', { class: 'loading', role: 'status', text: 'Reading the logbook…' })); return h('div', null, [head, body]); }
    if (!t.block) { body.appendChild(h('p', { class: 'empty', text: 'No blocks on the Residents Roster yet.' })); return h('div', null, [head, body]); }

    var b = t.block, today = nowM().key, req = t.procs.filter(function (p) { return p.min > 0; });
    var when = today < b.start ? 'Starts ' + dShort(b.start) : today > b.end ? 'Ended ' + dShort(b.end) : 'Day ' + (between(b.start, today) + 1) + ' of ' + (between(b.start, b.end) + 1);
    body.appendChild(h('div', { class: 't-title' }, [
      h('div', null, [h('h1', { text: 'Block ' + b.n }), h('p', { text: dm(b.start) + ' to ' + dm(b.end) + ' ' + b.end.slice(0, 4) + ' · ' + when })]),
      h('div', { class: 't-actions' }, [
        h('button', { class: 'btn btn-line btn-small', type: 'button', disabled: S.busy, onclick: startPractice }, 'Try the resident screens'),
        h('button', { class: 'btn btn-line btn-small', type: 'button', disabled: S.tBusy || !t.totals.wait, onclick: remind }, 'Remind co-signers'),
        h('a', { class: 'btn btn-small', href: t.sheet, target: '_blank', rel: 'noopener' }, 'Open the sheet')
      ])
    ]));
    if (S.tNote) body.appendChild(h('p', { class: 'banner', role: 'status' }, [icon('done'), h('span', { style: 'font-size:16px', text: S.tNote })]));
    if (S.tError) body.appendChild(h('p', { class: 'err', role: 'alert', text: S.tError }));
    var T = t.totals;
    body.appendChild(h('div', { class: 'stats' }, [
      stat('Co-signed', T.done, 'of ' + T.required + ' required', ''),
      stat('Waiting for co-sign', T.wait, T.wait ? 'with ' + T.cosigners + (T.cosigners === 1 ? ' co-signer' : ' co-signers') : 'nothing waiting', 'amber'),
      stat('Minimums met', T.met, 'of ' + T.of, ''),
      stat('Returned', T.back, T.back === 1 ? 'to the resident' : 'to the residents', 'red')
    ]));
    var rows = t.residents.map(function (r) {
      return h('tr', null, [h('td', null, [h('b', { text: r.name }), h('small', { text: [r.level, r.area].filter(String).join(' · ') })])]
        .concat(req.map(function (p) {
          var x = r.per[p.name] || { done: 0 };
          return h('td', null, x.done >= p.min ? h('span', { class: 'met', text: x.done + ' / ' + p.min + ' done' }) : h('span', { class: x.done ? '' : 'zero', text: x.done + ' / ' + p.min }));
        }))
        .concat([h('td', { class: r.wait ? 'w' : 'zero', text: String(r.wait) }), h('td', { class: 'tot', text: r.total + ' / ' + req.reduce(function (s, p) { return s + p.min; }, 0) })]));
    });
    body.appendChild(h('section', { class: 'card panel' }, [
      h('h2', { text: 'Co-signed so far, against each minimum' }),
      t.residents.length ? h('div', { class: 'table-box' }, [h('table', { class: 't' }, [
        h('thead', null, [h('tr', null, [h('th', { text: 'Resident' })].concat(req.map(function (p) { return h('th', { text: p.short }); })).concat([h('th', { text: 'Waiting' }), h('th', { text: 'Total' })]))]),
        h('tbody', null, rows)
      ])]) : h('p', { class: 'note', style: 'padding:0 16px 12px', text: 'Nobody is on the roster for this block yet.' })
    ]));
    var waitList = t.waiting.length ? h('ul', null, t.waiting.map(function (w) {
      return h('li', null, [h('span', null, [h('b', { text: dr(w.cos) }), ' · ' + w.by.map(function (x) { return x.name.split(' ')[0] + ' ' + x.n; }).join(', ')]), h('b', { class: 'n', text: String(w.n) })]);
    })) : h('p', { class: 'note', text: 'Nothing is waiting.' });
    var backList = t.returned.length ? h('ul', null, t.returned.map(function (x) {
      return h('li', null, [h('span', null, [h('b', { text: x.name.split(' ')[0] }), ' · ' + x.proc + ', ' + dShort(x.date) + '. ' + dr(x.cos) + ': “' + x.why + '”'])]);
    })) : h('p', { class: 'note', text: 'Nothing returned.' });
    var endText = t.summarySent ? 'The summaries went out on ' + dShort(t.summarySent.slice(0, 10)) + ' to each resident, their evaluator and you.'
      : 'On ' + dShort(t.summaryOn) + ', the morning after the block ends, each resident and their evaluator get the summary by email, and so do you.';
    var L = t.learning || { tracks: [], list: [], teaching: [] };
    if (L.tracks.length && t.residents.length) body.appendChild(h('section', { class: 'card panel' }, [
      h('h2', { text: 'Reading on picuhub.om, against each target' }),
      h('div', { class: 'table-box' }, [h('table', { class: 't' }, [
        h('thead', null, [h('tr', null, [h('th', { text: 'Resident' })].concat(L.tracks.map(function (k) { return h('th', { text: k.name }); })).concat([h('th', { text: 'Targets met' }), h('th', { text: 'Teaching co-signed' })]))]),
        h('tbody', null, L.list.map(function (r) {
          return h('tr', null, [h('td', null, [h('b', { text: r.name })])].concat(L.tracks.map(function (k) {
            var n = r.read[k.name] || 0;
            return h('td', null, k.need && n >= k.need ? h('span', { class: 'met', text: n + ' / ' + k.total }) : h('span', { class: n ? '' : 'zero', text: n + ' / ' + k.total }));
          })).concat([h('td', { class: 'tot', text: r.met + ' / ' + L.tracks.filter(function (k) { return k.need; }).length }), h('td', { class: r.teach ? '' : 'zero' }, [String(r.teach || 0), r.twait ? h('span', { class: 'w', text: ' +' + r.twait + ' waiting' }) : null])]));
        }))
      ])]),
      h('p', { class: 'note', style: 'padding:8px 16px 4px', text: 'Targets: ' + L.tracks.filter(function (k) { return k.need; }).map(function (k) { return k.name + ' ' + k.need + ' of ' + k.total; }).join(', ') + '.' })
    ]));
    if (L.teaching.length) body.appendChild(h('section', { class: 'card mini' }, [h('h2', { text: 'Teaching received' }), h('ul', null, L.teaching.slice(0, 40).map(function (x) {
      var st = tst(x);
      return h('li', null, [h('span', null, [h('b', { text: x.name.split(' ')[0] }), ' · ' + x.topic + ' · ' + dr(x.by) + ', ' + x.type.toLowerCase() + ', ' + dShort(x.date)]), st === 'ok' ? null : h('span', { class: 'st st-' + st, text: TST[st] })]);
    }))]));
    body.appendChild(h('div', { class: 'cards3' }, [
      h('section', { class: 'card mini' }, [h('h2', { text: 'Waiting for co-sign' }), waitList]),
      h('section', { class: 'card mini' }, [h('h2', { text: 'Returned' }), backList]),
      h('section', { class: 'card mini' }, [h('h2', { text: 'End of block' }), h('p', { text: endText })])
    ]));
    return h('div', null, [head, body]);
  }

  function stat(label, n, small, tone) {
    return h('div', { class: 'card stat' }, [h('span', { text: label }), h('b', { class: tone && n ? tone : null, text: String(n) }), h('small', { text: small })]);
  }

  function remind() {
    S.tBusy = true; S.tNote = ''; render();
    call('remind').then(function (r) {
      S.tBusy = false;
      if (r.ok) { S.tNote = r.message; loadTracker(); }
      else if (r.error === 'signed_out') signedOut(r.message);
      else { S.tError = r.message || NET; render(); }
    });
  }

  var VIEWS = { signin: vSignin, code: vCode, loading: vLoading, progress: vProgress, log: vLog, mylog: vMylog, tracker: vTracker, reading: vReading, teach: vTeach };

  // ---------------------------------------------------------- start

  window.addEventListener('hashchange', function () {
    if (location.hash !== '#mylog') S.flash = null;
    if (location.hash !== '#log' && location.hash !== '#teach') S.error = S.step === 'email' && !S.token ? S.error : '';
    if (location.hash !== '#reading') S.readErr = '';
    S.sheet = null;
    render();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !S.token) return;
    if (Date.now() - S.lastFetch > 60000) { if (route() === 'tracker') loadTracker(); else refresh(true); }
  });

  render();
  if (S.token) refresh(true);
})();
</script>
<script src="install.js" data-app="PICU Logbook" data-key="picu-logbook" data-sub="Then open it from the icon and sign in there, once." data-color="#0F5E63" data-ink="#1C2B2C" data-soft="#55696B" data-icon="apple-touch-icon.png" defer></script>
</body>
